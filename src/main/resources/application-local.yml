spring:
  datasource:
    url: jdbc:h2:mem:spitoring;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: local-dev-secret-key-must-be-at-least-32-chars
