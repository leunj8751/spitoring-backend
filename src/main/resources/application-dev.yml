spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/spitoring
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: dev-secret-key-must-be-at-least-32-chars-long
