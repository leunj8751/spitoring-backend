spring:
  profiles:
    active: dev

  application:
    name: spitoring-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.spitoring: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000    # 1시간
    refresh-token-expiry-ms: 604800000 # 7일
  fcm:
    credentials-path: ${FCM_CREDENTIALS_PATH:firebase/service-account.json}
  crawler:
    spitto-url: https://www.dhlottery.co.kr/selectMainInfo.do
    schedule-cron: "0 0 5 * * *"      # 매일 새벽 5시
