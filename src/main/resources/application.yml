spring:
  profiles:
    active: local

  application:
    name: spitoring-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.spitoring: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000    # 1시간
    refresh-token-expiry-ms: 604800000 # 7일
  fcm:
    credentials-path: ${FCM_CREDENTIALS_PATH:firebase/service-account.json}
  crawler:
    spitto-url: https://dhlottery.co.kr/gameInfo.do?method=gameInfo&strGameId=spitto
    schedule-cron: "0 0/30 * * * *"   # 30분마다
